<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ScoutCTX</title>
  <desc id="desc">A terminal showing ScoutCTX selecting focused repository context for an AI coding task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ee7b7"/>
      <stop offset="0.5" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="1070" cy="60" r="170" fill="#2563eb" opacity=".14" filter="url(#glow)"/>
  <circle cx="90" cy="470" r="190" fill="#10b981" opacity=".1" filter="url(#glow)"/>

  <g transform="translate(70 73)">
    <path d="M0 33 31 2l31 31-31 31z" fill="none" stroke="url(#brand)" stroke-width="5"/>
    <path d="m19 33 9 9 18-20" fill="none" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="48" fill="url(#brand)" font-size="54" font-weight="750" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="-2">ScoutCTX</text>
    <text x="0" y="106" fill="#cbd5e1" font-size="23" font-family="ui-sans-serif, system-ui, sans-serif">Signal for your coding agent.</text>
    <text x="0" y="142" fill="#64748b" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">local-first · task-aware · zero dependencies</text>
  </g>

  <g transform="translate(550 66)">
    <rect width="580" height="368" rx="16" fill="#060b14" stroke="#334155"/>
    <path d="M0 46h580" stroke="#1e293b"/>
    <circle cx="24" cy="23" r="6" fill="#fb7185"/>
    <circle cx="44" cy="23" r="6" fill="#fbbf24"/>
    <circle cx="64" cy="23" r="6" fill="#4ade80"/>
    <text x="290" y="29" text-anchor="middle" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/project</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
      <text x="24" y="82" fill="#6ee7b7">$</text>
      <text x="42" y="82" fill="#e2e8f0">scoutctx "fix flaky OAuth tests"</text>
      <text x="24" y="121" fill="#93c5fd">◆ scouting 146 files against 8,000 tokens</text>
      <text x="24" y="158" fill="#94a3b8">01</text>
      <text x="56" y="158" fill="#f8fafc">src/auth/callback.ts</text>
      <text x="385" y="158" fill="#6ee7b7">changed + path</text>
      <text x="24" y="188" fill="#94a3b8">02</text>
      <text x="56" y="188" fill="#f8fafc">tests/oauth.test.ts</text>
      <text x="385" y="188" fill="#93c5fd">task match</text>
      <text x="24" y="218" fill="#94a3b8">03</text>
      <text x="56" y="218" fill="#f8fafc">src/session/store.ts</text>
      <text x="385" y="218" fill="#c4b5fd">content</text>
      <path d="M24 244h532" stroke="#1e293b"/>
      <text x="24" y="277" fill="#6ee7b7">✓ 7 files selected</text>
      <text x="24" y="307" fill="#6ee7b7">✓ secrets redacted</text>
      <text x="24" y="337" fill="#6ee7b7">✓ 7,842 tokens</text>
      <rect x="210" y="324" width="8" height="16" fill="#93c5fd">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>

